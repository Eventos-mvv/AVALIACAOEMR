<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Avaliação do Treinamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Poppins:wght@400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --noite:#0a0705;
  --salvia:#c6cecc;      /* letras do cartaz */
  --areia:#d4a26a;       /* tom do casaco, mais claro */
  --areia-2:#e3b982;
  --terra:#5c2c13;
  --texto:#f3eee8;
  --suave:rgba(243,238,232,.62);
  --linha:rgba(243,238,232,.26);
  --erro:#ffb4a2;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:var(--noite);color:var(--texto);
  font-family:Poppins,system-ui,sans-serif;font-size:16px;line-height:1.5;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(120% 70% at 85% 0%,rgba(122,16,35,.55) 0%,rgba(122,16,35,0) 62%),
    radial-gradient(90% 60% at 0% 100%,rgba(122,16,35,.35) 0%,rgba(122,16,35,0) 65%),
    var(--noite);
}


html,body{height:100%}
body{height:100dvh;display:flex;justify-content:center;overflow:hidden}
.app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;position:relative}
@media (min-width:760px){.app{height:92dvh;margin:4dvh 0;background:rgba(10,7,5,.5);border:1px solid rgba(243,238,232,.14)}}

.chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:clamp(28px,6vh,56px) 22px 18px}
.head{margin-bottom:28px;animation:rise .9s var(--ease) both;text-shadow:0 1px 12px rgba(0,0,0,.5)}
h1{margin:0;font-family:"Bodoni Moda",Georgia,serif;font-weight:600;font-size:clamp(44px,13vw,64px);line-height:1.02;letter-spacing:-.005em;color:#fff;text-wrap:balance}
.regua{width:46px;height:2px;background:var(--areia);margin:22px 0 16px;transform-origin:left;animation:regua 1s .25s var(--ease) both}
.meta{margin:0;font-size:12.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}

/* conversa */
.msgs{display:flex;flex-direction:column;gap:10px}
.b{max-width:86%;padding:12px 16px;font-size:16px;line-height:1.45;border-radius:18px;overflow-wrap:anywhere;animation:pop .35s var(--ease) both}
.b.bot{align-self:flex-start;background:rgba(10,7,5,.8);border:1px solid rgba(243,238,232,.16);border-bottom-left-radius:4px;color:var(--texto)}
.b.me{align-self:flex-end;background:var(--areia);color:var(--noite);font-weight:500;border-bottom-right-radius:4px}
.b.bad{color:var(--erro);border-color:rgba(255,180,162,.45)}
.typing{display:flex;gap:5px;align-items:center;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--salvia);animation:pulso 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}

/* estados (chips) */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;animation:pop .35s var(--ease) both}
.chip{padding:10px 0;border-radius:999px;border:1px solid rgba(243,238,232,.34);background:rgba(10,7,5,.78);color:var(--texto);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:border-color .2s,background-color .2s}
.chip:hover,.chip:focus-visible{outline:0;border-color:var(--areia);background:rgba(212,162,106,.18)}

/* resumo */
.b.card{align-self:stretch;max-width:100%;padding:6px 16px 16px}
.b.card.off{opacity:.55;pointer-events:none}
.row{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid rgba(243,238,232,.1)}
.row .lab{flex:none;width:112px;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--salvia)}
.row .val{flex:1;min-width:0;font-size:16px;color:#fff;overflow-wrap:anywhere}
.row .ed,.acts .alt{flex:none;background:none;border:0;padding:4px 0 4px 8px;font:inherit;font-size:14px;font-weight:500;color:var(--areia);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
button.primary{width:100%;margin-top:16px;padding:16px 18px;border:0;border-radius:3px;background:var(--areia);color:var(--noite);font:inherit;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background-color .3s var(--ease)}
button.primary:hover{background:var(--areia-2)}
.acts{display:flex;flex-wrap:wrap;gap:6px 18px;animation:pop .35s var(--ease) both}
.acts .alt{padding-left:0}

/* sucesso */
.selo{width:54px;height:54px;display:block;margin-bottom:12px}
.selo circle{stroke:var(--areia);stroke-width:1.4;fill:none;stroke-dasharray:158;stroke-dashoffset:158;animation:traco .9s .1s var(--ease) forwards}
.selo path{stroke:var(--areia);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;animation:traco .6s .7s var(--ease) forwards}
.okt{margin:0 0 6px;font-family:"Bodoni Moda",Georgia,serif;font-weight:500;font-size:28px;line-height:1.1;color:#fff}
.okp{margin:0}

/* campo de resposta */
.comp{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,7,5,.86);border-top:1px solid rgba(243,238,232,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.comp input{flex:1;min-width:0;padding:13px 18px;border-radius:26px;background:rgba(6,4,3,.7);border:1px solid rgba(243,238,232,.34);color:var(--texto);font:inherit;font-size:16px;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.comp input::placeholder{color:rgba(243,238,232,.5)}
.comp input:focus{outline:0;border-color:var(--areia);box-shadow:0 0 0 1px var(--areia)}
.comp input:disabled{opacity:.55}
.comp button{flex:none;width:48px;height:48px;border:0;border-radius:50%;background:var(--areia);color:var(--noite);cursor:pointer;display:grid;place-items:center;transition:opacity .3s,background-color .3s}
.comp button:hover:not(:disabled){background:var(--areia-2)}
.comp button:disabled{opacity:.35;cursor:default}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes regua{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes traco{to{stroke-dashoffset:0}}
@keyframes pulso{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

.logo{display:block;width:min(300px,78%);height:auto;margin:0 0 26px -4px;filter:brightness(0) invert(.95)}

/* notas (estrelas) e pular */
.rate{display:flex;gap:8px;animation:pop .35s var(--ease) both}
.rate button{flex:1;padding:13px 0;border-radius:14px;border:1px solid rgba(243,238,232,.34);background:rgba(10,7,5,.78);color:var(--texto);font:inherit;font-size:17px;font-weight:600;cursor:pointer;transition:border-color .2s,background-color .2s}
.rate button span{color:var(--areia);margin-left:2px}
.rate button:hover,.rate button:focus-visible{outline:0;border-color:var(--areia);background:rgba(212,162,106,.18)}
.b.longo{max-width:100%;white-space:pre-line}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;animation:pop .35s var(--ease) both}
.opts .chip{padding:13px 8px;border-radius:14px;font-size:15px}
.skip{display:flex;animation:pop .35s var(--ease) both}
.skip .chip{padding:10px 18px}
.row .val .est{color:var(--areia);letter-spacing:.05em;margin-right:6px}

/* ===== tema claro: degradê branco → vinho, fonte parecida com a do logo ===== */
:root{color-scheme:light;--vinho:#7a0f23;--vinho-2:#5a0a19;--vinho-3:#9b2236;--tinta:#2a0d12;--titulo:"Bebas Neue","Oswald",Impact,sans-serif}
body{background:#fff;color:var(--tinta)}
body::before{background:linear-gradient(180deg,#ffffff 0%,#ffffff 16%,#f7e6e8 36%,#cf4a59 68%,#7a0f23 100%)}
@media (min-width:760px){.app{background:none;border:1px solid rgba(122,16,35,.18)}}

.head{text-shadow:none}
.logo{filter:none;width:min(290px,76%)}
h1{font-family:var(--titulo);font-weight:400;font-size:clamp(54px,17vw,84px);line-height:.94;letter-spacing:.01em;color:var(--vinho)}
.regua{background:var(--vinho);height:3px;width:56px}
.meta{font-family:var(--titulo);font-weight:400;font-size:18px;letter-spacing:.14em;color:var(--vinho-3)}

.b.bot{background:#fff;border:1px solid rgba(122,16,35,.2);color:var(--tinta);box-shadow:0 1px 6px rgba(60,10,20,.12)}
.b.q{font-family:var(--titulo);font-size:23px;line-height:1.15;letter-spacing:.03em;color:var(--vinho)}
.b.me{background:#3d0713;color:#fff;border:1px solid rgba(255,255,255,.22)}
.b.bad{background:#fff0f1;color:#a1121f;border-color:rgba(161,18,31,.45)}
.typing i{background:var(--vinho)}

.chip,.rate button{background:#fff;border:1.5px solid var(--vinho);color:var(--vinho)}
.chip:hover,.chip:focus-visible,.rate button:hover,.rate button:focus-visible{background:var(--vinho);border-color:var(--vinho);color:#fff}

.row{border-bottom-color:rgba(122,16,35,.14)}
.row .lab{color:var(--vinho-3)}
.row .val{color:var(--tinta)}
.row .ed{color:var(--vinho)}
.acts .alt{color:#fff;text-shadow:0 1px 4px rgba(60,10,20,.5)}
button.primary{background:var(--vinho);color:#fff}
button.primary:hover{background:var(--vinho-2)}

.selo circle,.selo path{stroke:var(--vinho)}
.okt{font-family:var(--titulo);font-weight:400;font-size:36px;color:var(--vinho)}

.comp{background:rgba(255,255,255,.94);border-top:1px solid rgba(122,16,35,.22)}
.comp input{background:#fff;border:1px solid rgba(122,16,35,.45);color:var(--tinta)}
.comp input::placeholder{color:rgba(42,13,18,.5)}
.comp input:focus{border-color:var(--vinho);box-shadow:0 0 0 1px var(--vinho)}
.comp input:disabled{opacity:.6}
.comp button{background:var(--vinho);color:#fff}
.comp button:hover:not(:disabled){background:var(--vinho-2)}
</style>
</head>

  {k:'limpeza', lab:'Limpeza', type:'opt', opts:OPCOES, q:'E quanto à limpeza do local?'},
  {k:'alimentacao', lab:'Alimentação', type:'opt', opts:OPCOES, q:'Quanto à alimentação oferecida no treinamento?'},
  {k:'assuntos', lab:'Assuntos', type:'opt', opts:OPCOES, q:'Quanto aos assuntos abordados?'},
  {k:'assuntoFaltou', lab:'Faltou assunto', yn:true, q:'Existe algum assunto que você acha necessário ser abordado e que não foi?', follow:'Qual assunto você acha que faltou?', ph:'Escreva aqui', skip:'Prefiro não escrever', val:txtYN},
  {k:'chamouAtencao', lab:'Chamou atenção', q:'O que mais te chamou atenção durante o treinamento?', ph:'Escreva aqui (opcional)', skip:'Pular', val:maxTxt},
  {k:'melhorar', lab:'Melhorar', q:'O que você acha que podemos melhorar?', ph:'Escreva aqui', val:txtYN},
  {k:'sugestao', lab:'Sugestão', yn:true, q:'Você tem alguma sugestão para aprimorarmos os próximos treinamentos?', follow:'Compartilhe conosco sua opinião, ideias ou pontos que considera importantes. Sua contribuição é muito valiosa para nós!', ph:'Escreva aqui', skip:'Prefiro não escrever', val:txtYN}
];

const PARTICULAS = new Set(['da','de','do','das','dos','e']);
/* gera as "chaves" do nome: cada nome combinado com o último sobrenome
   ex.: John Wesley Almeida -> john_almeida, wesley_almeida */
function chavesNome(nome){
  let p = nome.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
    .replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(Boolean);
  const util = p.filter(w => !PARTICULAS.has(w));
  if(util.length >= 2) p = util;
  const ultimo = p[p.length - 1], out = new Set();
  p.slice(0, -1).forEach(w => { if(w !== ultimo) out.add(EVENTO_ID + '__' + [w, ultimo].sort().join('_')); });
  if(!out.size) out.add(EVENTO_ID + '__' + ultimo);
  return [...out];
}
async function jaRespondeu(nome){
  const snaps = await Promise.all(chavesNome(nome).map(k => db.collection('bloqueios').doc(k).get()));
  return snaps.some(s => s.exists);
}

const data = {};
let cur = -1, locked = true, busy = false, ynText = false;
const first = () => (data.nome || '').split(' ')[0];

function scroll(){ requestAnimationFrame(() => chat.scrollTo({top: chat.scrollHeight, behavior: 'smooth'})); }
function add(cls, content){
  const d = document.createElement('div'); d.className = 'b ' + cls;
  if(typeof content === 'string') d.textContent = content; else d.appendChild(content);
  msgs.appendChild(d); scroll(); return d;
}
async function bot(content, cls = ''){
  const t = document.createElement('div'); t.className = 'b bot typing'; t.innerHTML = '<i></i><i></i><i></i>';
  msgs.appendChild(t); scroll();
  await wait(typeof content === 'string' ? Math.min(450 + content.length * 12, 1300) : 700);
  t.remove();
  return add('bot ' + cls, content);
}
function setComposer(on, s, off){
  inp.disabled = !on; go.disabled = !on; inp.value = '';
  if(on){
    inp.placeholder = s.ph || 'Digite aqui';
    inp.inputMode = 'text';
    inp.setAttribute('autocapitalize', s.cap || 'sentences');
    inp.setAttribute('autocomplete', s.auto || 'off');
    inp.focus({preventScroll: true});
  } else inp.placeholder = off || 'Aguarde…';
}
function showRate(){
  const w = document.createElement('div'); w.className = 'rate';
  for(let n = 1; n <= 5; n++){
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Nota ' + n);
    b.innerHTML = n + '<span>★</span>'; b.onclick = () => answer(n); w.appendChild(b);
  }
  msgs.appendChild(w); scroll();
}
function showOpts(s){
  const w = document.createElement('div'); w.className = 'opts';
  s.opts.forEach(o => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = o;
    b.onclick = () => answer(o); w.appendChild(b);
  });
  msgs.appendChild(w); scroll();
}
function showSkip(s){
  const w = document.createElement('div'); w.className = 'skip';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = s.skip;
  b.onclick = () => answer(null); w.appendChild(b);
  msgs.appendChild(w); scroll();
}
function actions(list){
  const w = document.createElement('div'); w.className = 'acts';
  list.forEach(([txt, fn]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'alt'; b.textContent = txt;
    b.onclick = () => { w.remove(); fn(); }; w.appendChild(b);
  });
  msgs.appendChild(w); scroll();
}

async function ask(i){
  cur = i; locked = true; ynText = false; setComposer(false);
  const s = steps[i];
  await bot(s.q, 'q');
  if(s.type === 'opt'){ showOpts(s); setComposer(false, null, 'Escolha uma opção acima'); }
  else if(s.yn){ showOpts({opts:['Sim', 'Não']}); setComposer(false, null, 'Escolha uma opção acima'); }
  else { if(s.skip) showSkip(s); setComposer(true, s); }
  locked = false;
}
async function answer(v){
  if(locked) return;
  const s = steps[cur];
  if(s.yn && !ynText && v !== null){
    locked = true; document.querySelectorAll('.opts,.skip').forEach(c => c.remove());
    add('me', v);
    if(v === 'Não'){ data[s.k] = ''; proceed(); }
    else { ynText = true; bot(s.follow, 'q').then(() => { showSkip(s); setComposer(true, s); locked = false; }); }
    return;
  }
  if(v !== null && s.val){ const e = s.val(v); if(e){ add('bot bad', e); return; } }
  if(s.k === 'nome'){
    locked = true; setComposer(false, null, 'Verificando…');
    let dup = false;
    try{ dup = await jaRespondeu(v); }catch(err){ console.error(err); }
    if(dup){
      add('bot bad', 'Já recebemos uma avaliação com esse nome. Cada pessoa pode responder apenas uma vez. Se acredita que é um engano, fale com a coordenação.');
      setComposer(true, s); locked = false; return;
    }
  }
  locked = true;
  document.querySelectorAll('.opts,.skip').forEach(c => c.remove());
  if(v === null){ data[s.k] = ''; add('me', s.skip); }
  else { data[s.k] = v; add('me', String(v)); }
  ynText = false; proceed();
}
function proceed(){
  if(cur + 1 < steps.length) ask(cur + 1);
  else enviar();
}
$('comp').addEventListener('submit', e => {
  e.preventDefault();
  const v = clean(inp.value); if(v) answer(v);
});

async function enviar(){
  if(busy) return; busy = true; locked = true;
  setComposer(false, null, 'Enviando…');
  try{
    await Promise.race([
      (() => {
        const ts = firebase.firestore.FieldValue.serverTimestamp();
        const batch = db.batch();
        batch.set(db.collection('avaliacoes').doc(), {
          evento: EVENTO_ID, nome: data.nome, local: data.local, limpeza: data.limpeza, alimentacao: data.alimentacao,
          assuntos: data.assuntos, assuntoFaltou: data.assuntoFaltou, chamouAtencao: data.chamouAtencao,
          melhorar: data.melhorar, sugestao: data.sugestao, criadoEm: ts
        });
        chavesNome(data.nome).forEach(k => batch.set(db.collection('bloqueios').doc(k), {evento: EVENTO_ID, criadoEm: ts}));
        return batch.commit();
      })(),
      new Promise((_, r) => setTimeout(() => r({code:'timeout'}), 15000))
    ]);
    const ok = document.createElement('div');
    ok.innerHTML = '<svg class="selo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25"/><path d="M21 33l8 8 15-17"/></svg><h2 class="okt">Avaliação enviada!</h2><p class="okp"></p>';
    ok.querySelector('.okp').textContent = 'Obrigado, ' + first() + '! Agradecemos pela disponibilidade e por contribuírem conosco nesse processo. Que possamos seguir juntos, crescendo e avançando no propósito que Deus nos confiou!';
    await bot(ok);
    setComposer(false, null, 'Avaliação enviada');
  }catch(e){
    console.error(e);
    let perm = e.code === 'permission-denied';
    if(perm){
      let dup = false; try{ dup = await jaRespondeu(data.nome); }catch(_){}
      if(dup){ await bot('Já recebemos uma avaliação com esse nome. Cada pessoa pode responder apenas uma vez.', 'bad'); return; }
    }
    await bot(perm ? 'Sem permissão para enviar. Avise a coordenação.' : 'Não consegui enviar agora. Verifique a internet e tente de novo.', 'bad');
    actions([['Tentar de novo', () => { busy = false; enviar(); }]]);
  }
}

(async () => {
  await bot("Olá, queridos! A paz!\n\nEstamos muito felizes com o início deste novo ciclo e cremos na abundante graça de Deus para nos capacitar em tudo o que Ele nos confiou. Cremos que será um ano glorioso e cheio de frutos!\n\nPara nós, da Supervisão EMR, é muito importante saber como foi a experiência de vocês no Treinamento de Novas Diretorias.\n\nPor isso, pedimos que dediquem alguns minutos para responder à avaliação abaixo. A participação de vocês nos ajudará a aprimorar os próximos treinamentos e torná-los cada vez mais proveitosos.\n\nAgradecemos pela disponibilidade e contribuição!\n\nQue sigamos juntos, crescendo e avançando no propósito que Deus nos confiou! 🙌🏻", 'longo');
  ask(0);
})();
